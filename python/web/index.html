<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MatchApp Ai | Immersive Python Preview</title>
  <meta name="theme-color" content="#100814" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="polish.css" />
</head>
<body>
  <div class="world">
    <header class="app-head"><div class="app-brand"><span class="app-symbol" aria-hidden="true">✦</span><span>MatchApp <em>Ai</em></span></div><span class="preview-mark">Python · local preview</span></header>
    <div class="stage" id="stage">
      <div class="screen">
        <div class="portrait-wrap">
          <div class="halo"></div>
          <button class="portrait" id="face" type="button" aria-label="Wake Jonas">
            <img class="plate is-on" data-shape="rest" alt="" />
            <img class="plate" data-shape="blink" alt="" />
            <img class="plate" data-shape="smile" alt="" />
            <img class="plate" data-shape="aa" alt="" />
            <img class="plate" data-shape="oh" alt="" />
            <img class="plate" data-shape="ee" alt="" />
            <div class="fade"></div>
            <div class="lockup">
              <div>
                <div class="kicker">MatchApp Ai</div>
                <h1 id="name">Jonas</h1>
                <p id="role">Warm baritone</p>
              </div>
              <span class="status"><i></i><span id="status">Waiting</span></span>
            </div>
          </button>
        </div>
        <section class="panel">
          <div class="kicker">Tonight</div>
          <h2>What should I watch?</h2>
          <p class="lead" id="lead">Tap the face. He comes off the screen, says hello, then waits.</p>
          <div class="switch" role="group" aria-label="Choose companion">
            <button type="button" id="pick-jonas" class="is-picked">Jonas</button>
            <button type="button" id="pick-aureya">Aureya</button>
          </div>
          <p class="said"><span id="who-said">Jonas</span><span id="caption">Waiting on this side of the screen.</span><span class="note" id="note"></span></p>
          <div class="row">
            <button class="gold" id="primary" type="button">Wake</button>
            <button class="ghost" id="stop" type="button">Stop</button>
          </div>
          <div class="chips">
            <button class="chip" data-line="feelgood" type="button">Something warm</button>
            <button class="chip" data-line="sports" type="button">Something live</button>
            <button class="chip" data-line="anime" type="button">Anime tonight</button>
            <button class="chip" data-line="where" type="button">Where to watch</button>
          </div>
          <form class="ask" id="ask">
            <input id="draft" placeholder="Ask Jonas…" autocomplete="off" aria-label="Ask" />
            <button type="submit" aria-label="Send">→</button>
          </form>
        </section>
      </div>
      <div class="tonight">
        <button class="pick" data-line="feelgood" type="button"><span class="kicker">Warm</span><strong>The Intern</strong><span>Gentle, funny, easy to sink into</span></button>
        <button class="pick" data-line="sports" type="button"><span class="kicker">Live</span><strong>A match on</strong><span>Stay with it while it happens</span></button>
        <button class="pick" data-line="anime" type="button"><span class="kicker">Anime</span><strong>Spy x Family</strong><span>Bright, one perfect episode</span></button>
        <button class="pick" data-line="where" type="button"><span class="kicker">Where</span><strong>Name a title</strong><span>Points you to where it plays</span></button>
      </div>
    </div>
  </div>
  <button type="button" class="mini-dock" id="mini-dock" aria-label="Return to companion" hidden><img src="faces/jonas/rest.jpg" alt="" /><span><strong>Jonas</strong><small>Waiting</small></span></button>
  <audio id="voice" preload="none" playsinline></audio>
  <script src="app.js"></script>
  <script src="polish.js"></script>
</body>
</html>
